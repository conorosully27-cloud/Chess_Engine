<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Play chess on your phone: drag or tap pieces to legal squares.">
<meta name="theme-color" content="#e9e9e2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Martian+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<main class="layout">
  <header class="status" id="status" aria-live="polite">
    <span class="turn-mark" id="turn-mark" aria-hidden="true"></span>
    <div class="status-text">
      <p class="status-line"><span id="status-move">Move 1</span><span class="status-detail" id="status-detail"></span></p>
      <h1 class="status-headline" id="status-headline">White to move</h1>
    </div>
    <button type="button" class="style-button" id="style-button" aria-haspopup="dialog" aria-expanded="false" aria-controls="style-sheet">Style</button>
  </header>

  <div class="diagram">
    <div class="ranks" id="ranks" aria-hidden="true"></div>
    <div class="board-wrap">
      <div class="board" id="board" role="application" aria-label="Chess board"></div>
      <div class="promotion" id="promotion" hidden>
        <div class="promotion-card" role="dialog" aria-label="Promote pawn to">
          <p class="promotion-title">Promote to</p>
          <div class="promotion-choices" id="promotion-choices"></div>
        </div>
      </div>
    </div>
    <div class="files" id="files" aria-hidden="true"></div>
  </div>

  <div class="controls">
    <button type="button" id="take-back">Take back</button>
    <button type="button" id="flip">Flip board</button>
    <button type="button" id="new-game">New game</button>
  </div>

  <section class="scoresheet" aria-label="Moves">
    <div class="scoresheet-head" aria-hidden="true"><span></span><span>White</span><span>Black</span></div>
    <ol class="moves" id="moves"></ol>
    <p class="moves-empty" id="moves-empty">No moves yet. Drag a piece, or tap it and then tap where it should go.</p>
  </section>
</main>

<div class="sheet-backdrop" id="style-sheet" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="style-title">
    <div class="sheet-head">
      <h2 class="sheet-title" id="style-title">Board &amp; pieces</h2>
      <button type="button" class="sheet-done" id="style-done">Done</button>
    </div>
    <h3 class="sheet-label" id="pieces-label">Pieces</h3>
    <div class="options" id="piece-options" role="group" aria-labelledby="pieces-label"></div>
    <h3 class="sheet-label" id="board-label">Board</h3>
    <div class="options" id="board-options" role="group" aria-labelledby="board-label"></div>
  </section>
</div>
<script type="module" src="app/ui.js"></script>
</body>
</html>
